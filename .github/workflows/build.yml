name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests del motor y de la app, y build
        run: ./gradlew :core:test :app:testDebugUnitTest :app:assembleDebug --stacktrace
      # AAB de release sin firmar: verifica que R8 (minify + shrinkResources) compile.
      # No prueba que la app ande minificada; eso se valida instalando el release en un celular.
      - name: Bundle de release (R8)
        run: ./gradlew :app:bundleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
